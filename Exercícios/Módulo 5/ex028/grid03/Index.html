<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na prática</title>
    <style>
        div.container{
            border: 3px solid blue;
        
            gap: 10px;
            display:grid;

            grid-template-rows: 80px 80px 80px;
            grid-template-rows: repeat(3, 80px);
            /*grid-auto-rows: 80px;*/ 

            /*grid-template-columns: 120px 120px 120px;*/
            grid-template-columns: 100px 40% repeat(2, 1fr);

            /*rid-template-columns: repeat(3, 120px);*/
            /*grid-auto-flow: column;*/
            /*grid-auto-columns: 120px;*/
            
                align-items: normal normal;
                justify-items: normal normal;
            /* place-items: start, center;  */ 
                align-content: normal normal;
                justify-content: normal normal;
            /* place-content: space-between, end; */ 
        }




        div.item{
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <div class="item">J</div>
    </div>
</body>
</html>
